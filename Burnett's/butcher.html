<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burnett's - Click & Collect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b-2 border-red-800 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-red-900">Burnett's Butcher Shop</h1>
                <p class="text-stone-600">Order online. Skip the line.</p>
            </div>
            <div class="bg-red-900 text-white px-4 py-2 rounded font-bold">
                Cart: $0.00
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Product 1 -->
            <div class="bg-white p-4 rounded-lg shadow border border-stone-200">
                <div class="h-40 bg-stone-200 rounded mb-4 flex items-center justify-center text-stone-500">[Image of Steaks]</div>
                <h3 class="text-xl font-bold text-stone-800">Weekend BBQ Box</h3>
                <p class="text-stone-600 text-sm mb-4">4x Striploins, 4x Gourmet Burgers, 1lb Bacon.</p>
                <div class="flex justify-between items-center">
                    <span class="text-lg font-bold text-red-800">$65.00</span>
                    <button class="bg-stone-800 text-white px-4 py-2 rounded hover:bg-stone-700">Add to Order</button>
                </div>
            </div>
            
            <!-- Product 2 (Upsell ) -->
            <div class="bg-white p-4 rounded-lg shadow border border-stone-200">
                <div class="h-40 bg-stone-200 rounded mb-4 flex items-center justify-center text-stone-500">[Image of Sauce]</div>
                <h3 class="text-xl font-bold text-stone-800">House BBQ Rub & Sauce</h3>
                <p class="text-stone-600 text-sm mb-4">Perfect pairing for your steaks and burgers.</p>
                <div class="flex justify-between items-center">
                    <span class="text-lg font-bold text-red-800">$12.00</span>
                    <button class="bg-stone-800 text-white px-4 py-2 rounded hover:bg-stone-700">Add to Order</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
